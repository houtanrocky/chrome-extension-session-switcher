name: Support request
description: Ask for setup help or clarify whether a workflow is supported.
title: "[Support]: "
labels: [support]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, cookies, tokens, personal data, or exported session backups. Use fictional site/account names.
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: "Chrome 145 on macOS"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to test?
      placeholder: "I need Admin and Standard user sessions for a dashboard..."
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: What did you try?
      placeholder: "I created a session, chose Open new tab, and..."
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy check
      options:
        - label: I removed passwords, cookies, tokens, personal data, and exported session files.
          required: true
